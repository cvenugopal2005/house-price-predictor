apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: house-price-fastapi
  name: house-price-fastapi
spec:
  replicas: 1
  selector:
    matchLabels:
      app: house-price-fastapi
  template:
    metadata:
      labels:
        app: house-price-fastapi
    spec:
      containers:
      - image: cvenugopal2005/house-price-fastapi:latest
        name: house-price-fastapi
        ports:
        - containerPort: 8000
        resources:
          requests:
            cpu: "50m"
            memory: "64Mi"
          limits:
            cpu: "100m"
            memory: "128Mi"
